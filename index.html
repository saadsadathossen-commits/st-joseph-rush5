<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>St. Joseph Rush: Dhaka Street Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0f172a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-wrapper {
            width: 100%;
            max-width: 420px;
            height: 700px;
            background: #1e293b;
            position: relative;
            overflow: hidden;
            border: 4px solid #10b981;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* Top HUD like Tesla Slapper */
        .top-hud {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: rgba(15, 23, 42, 0.85);
            border-bottom: 2px solid #334155;
        }
        .score-box {
            background: #0f172a;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #f59e0b;
            font-size: 16px;
            font-weight: bold;
            color: #f59e0b;
        }
        .route-info {
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 12px;
            border: 1px solid #475569;
        }
        /* Live Dialogue Bubble */
        .speech-bubble {
            position: relative;
            z-index: 10;
            margin: 10px 15px;
            background: rgba(15, 23, 42, 0.92);
            border: 2px solid #38bdf8;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            color: #e2e8f0;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        /* Bottom Controls */
        .bottom-hud {
            position: relative;
            z-index: 10;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to top, rgba(15,23,42,0.95), transparent);
        }
        .speed-btn {
            background: #10b981;
            color: #000;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px #047857;
            font-size: 15px;
        }
        .slap-btn {
            background: #ef4444;
            color: #fff;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px #b91c1c;
            font-size: 16px;
        }
        .speed-btn:active, .slap-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <!-- Top HUD -->
        <div class="top-hud">
            <div class="score-box" id="score-display">স্কোর: ০</div>
            <div class="route-info">
                <div style="color: #38bdf8; font-weight: bold;">📍 ফার্মগেট ➔ যোসেফ</div>
                <div style="font-size: 10px; color: #94a3b8;">পরের স্টপ: আসাদগেট</div>
            </div>
            <div style="font-size: 18px;">⏰ <span id="time-display">৭:১০</span></div>
        </div>

        <!-- Auto Dialogue Box -->
        <div class="speech-bubble" id="auto-dialogue">
            চালক সাদ (Josephite): মিশন শুরু! ফার্মগেটের জ্যাম ভেদ করে ৭:৫০ এর মধ্যে কলেজে ঢুকতেই হবে!
        </div>

        <!-- Game Canvas (Road, Rickshaw, Bike) -->
        <canvas id="canvas" width="420" height="420"></canvas>

        <!-- Bottom Controls matching the viral UI -->
        <div class="bottom-hud">
            <button class="speed-btn" onclick="boostSpeed()">
                <span style="font-size: 20px;">⚡</span>
                <span id="speed-text">৬০ km/h</span>
            </button>
            <button class="slap-btn" onclick="triggerSlapOrScience()">
                <span style="font-size: 22px;">✋</span>
                <span>সায়েন্স টক</span>
            </button>
        </div>
    </div>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let score = 0;
    let speed = 60;
    let distanceCovered = 0;
    let isGameOver = false;

    // Web Audio API for sound effects
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') { audioCtx.resume(); }
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'beep') {
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'slap') {
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        } else if (type === 'horn') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            osc.frequency.setValueAtTime(300, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    // Auto Dialogues List
    const dialogues = [
        "🚌 বাস হেলপার: এই মিয়া ডাইনে চাপান! ফার্মগেট জ্যামে পইড়া মরবি নাকি?",
        "💡 সাদ (Josephite): 'মামা, মোমেন্টাম কনজারভেশন ল' মানলে বাসের ভরবেগ আমার গতির চেয়ে কম হবে!'",
        "🛺 রিকশাওয়ালা: ১০০ টেকা ভাড়া দিস তো ভাই! সকালবেলা ফাজলামি করিস না!",
        "💡 সাদ (Josephite): 'ফ্রিকশন আর প্যাসকেলের সূত্র অনুযায়ী আপনার দাবি করা ভাড়া সম্পূর্ণ ইলিগ্যাল!'",
        "👮 সার্জেন্ট মামা: এই বাইক থামাও! উল্টাপালেনে আসছ কেন?",
        "💡 সাদ (Josephite): 'স্যার, আইনস্টাইনের স্পিড অব লাইট থিওরি অনুযায়ী আমার টাইম শর্ট, তাই শর্টকাট নিছি!'"
    ];

    let diagIndex = 0;
    setInterval(() => {
        if(!isGameOver) {
            diagIndex = (diagIndex + 1) % dialogues.length;
            document.getElementById("auto-dialogue").innerText = dialogues[diagIndex];
            playSound('beep');
        }
    }, 4000);

    let obstacles = [];
    function spawnObstacle() {
        let types = ['rickshaw', 'leguna', 'bus'];
        let t = types[Math.floor(Math.random() * types.length)];
        obstacles.push({
            x: Math.random() * 260 + 50,
            y: -60,
            width: t === 'bus' ? 65 : 45,
            height: t === 'bus' ? 80 : 55,
            type: t
        });
    }

    let bikeX = 185;
    let bikeY = 300;

    function boostSpeed() {
        speed = speed === 60 ? 90 : 60;
        document.getElementById("speed-text").innerText = speed + " km/h";
        playSound('horn');
    }

    function triggerSlapOrScience() {
        score += 50;
        distanceCovered += 20;
        playSound('slap');
        document.getElementById("score-display").innerText = "স্কোর: " + score;
        document.getElementById("auto-dialogue").innerText = "⚡ সায়েন্সের ফ্লেক্সে সামনের জ্যাম নিমিষেই উধাও! প্লাস ৫০ পয়েন্ট!";
    }

    function update() {
        if (isGameOver) return;

        distanceCovered += 0.5;
        score += 1;
        document.getElementById("score-display").innerText = "স্কোর: " + Math.floor(score);

        if (Math.random() < 0.03) {
            spawnObstacle();
        }

        obstacles.forEach((obs, index) => {
            obs.y += 3;
            if (obs.y > 450) {
                obstacles.splice(index, 1);
            }
        });

        if (distanceCovered >= 300) {
            isGameOver = true;
            document.getElementById("auto-dialogue").innerText = "🏆 অভিনন্দন সাদ! ৭:৫০ এর মধ্যে সেন্ট যোসেফ কলেজে পৌঁছে গেছ!";
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Road background (Dhaka street texture feel)
        ctx.fillStyle = "#334155";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Road Side Footpath / Buildings border
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(0, 0, 30, canvas.height);
        ctx.fillRect(390, 0, 30, canvas.height);

        // Road Lane lines
        ctx.strokeStyle = "#facc15";
        ctx.lineWidth = 4;
        ctx.setLineDash([20, 20]);
        ctx.beginPath();
        ctx.moveTo(140, 0); ctx.lineTo(140, canvas.height);
        ctx.moveTo(280, 0); ctx.lineTo(280, canvas.height);
        ctx.stroke();

        // Draw Obstacles (Rickshaw/Leguna)
        obstacles.forEach(obs => {
            ctx.fillStyle = obs.type === 'rickshaw' ? '#f97316' : (obs.type === 'leguna' ? '#ef4444' : '#3b82f6');
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            ctx.fillStyle = "#fff";
            ctx.font = "10px Arial";
            ctx.fillText(obs.type.toUpperCase(), obs.x + 5, obs.y + 25);
        });

        // Draw Player Bike (Student)
        ctx.fillStyle = "#2563eb";
        ctx.fillRect(bikeX, bikeY, 35, 60);
        ctx.fillStyle = "#fcd34d"; // Helmet
        ctx.beginPath();
        ctx.arc(bikeX + 17, bikeY + 10, 10, 0, Math.PI * 2);
        ctx.fill();
    }

    function loop() {
        update();
        draw();
        if (!isGameOver) {
            requestAnimationFrame(loop);
        }
    }

    loop();
</script>

</body>
</html>
